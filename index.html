    <script>
      (function() {
        try {
          var targetGlobal = typeof window !== 'undefined' ? window : (typeof globalThis !== 'undefined' ? globalThis : self);
          var activeFetch = targetGlobal.fetch;

          var makeConfigurable = function(target) {
            if (!target) return false;
            try {
              Object.defineProperty(target, 'fetch', {
                get: function() {
                  return activeFetch;
                },
                set: function(fn) {
                  activeFetch = fn;
                },
                configurable: true,
                enumerable: true
              });
              return true;
            } catch (err) {
              return false;
            }
          };

          makeConfigurable(targetGlobal);
          if (typeof Window !== 'undefined' && Window.prototype) {
            makeConfigurable(Window.prototype);
          }
        } catch (e) {
          // Pass-through
        }
      })();
    </script>
